server:
  port: 8090

spring:
  application:
    name: unified-media-cms

  datasource:
    url: jdbc:postgresql://localhost:5432/unified_media_cms
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3
    openai:
      base-url: https://api.openai.com
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      chat:
        options:
          model: gpt-4o-mini

app:
  pipeline:
    default-template-name: default-book-pipeline

cms:
  plugin:
    dir: "./plugins"
